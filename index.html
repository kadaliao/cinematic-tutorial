<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d0e11">
<title>电影语言入门｜从看懂到拍出来</title>
<meta name="description" content="面向零基础的电影语言学习路线：12 章 48 课手机练习，Melies 原站 424 条手法图鉴（真实片例 + 可复制提示词），附看片测验与提示词收藏夹。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8b86a'/%3E%3Cpath d='M11 9.5v13l11-6.5z' fill='%230d0e11'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('ct-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#0d0e11;--bg-2:#121318;--surface:#16181e;--surface-2:#1d2028;--surface-3:#252932;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --text:#eeebe5;--text-2:#c9c6bf;--muted:#8f929b;--faint:#5f636d;
  --accent:#e8b86a;--accent-ink:#1a1408;--accent-soft:rgba(232,184,106,.13);
  --ok:#7fc79a;--ok-soft:rgba(127,199,154,.14);--bad:#ef8a7a;--bad-soft:rgba(239,138,122,.14);
  --mark:rgba(232,184,106,.2);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --r:14px;--r-sm:9px;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --top:60px;--gut:clamp(16px,3vw,40px);--maxw:1320px;
  color-scheme:dark
}
:root[data-theme="light"]{
  --bg:#f6f3ee;--bg-2:#efebe4;--surface:#ffffff;--surface-2:#f4f1ec;--surface-3:#e9e4dc;
  --line:rgba(30,24,16,.09);--line-2:rgba(30,24,16,.16);
  --text:#1c1a17;--text-2:#3f3b35;--muted:#6f6a62;--faint:#a39d93;
  --accent:#b07a1f;--accent-ink:#fff;--accent-soft:rgba(176,122,31,.12);
  --ok:#2f8a55;--ok-soft:rgba(47,138,85,.1);--bad:#c0473a;--bad-soft:rgba(192,71,58,.09);
  --mark:rgba(176,122,31,.16);
  --shadow:0 18px 50px rgba(40,30,15,.16);
  color-scheme:light
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top) + 16px);-webkit-text-size-adjust:100%}
html.locked{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img,video{display:block;max-width:100%}
kbd{font:500 11px/1 var(--mono);padding:3px 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;color:var(--muted);background:var(--surface-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:8px}
.skip:focus{left:12px}
.muted{color:var(--muted)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut);height:var(--top);display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:16px;height:16px;fill:var(--accent-ink)}
.brand-name{font-family:var(--serif);font-size:17px}
.nav{display:flex;gap:2px;flex:1;min-width:0}
.nav a{position:relative;padding:7px 12px;border-radius:8px;color:var(--muted);font-size:14.5px;white-space:nowrap;transition:color .15s,background .15s}
.nav a:hover{color:var(--text);background:var(--surface-2)}
.nav a.on{color:var(--text)}
.nav a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-11px;height:2px;border-radius:2px;background:var(--accent)}
.nav-badge{display:inline-block;margin-left:5px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.nav-badge[hidden]{display:none}
.top-actions{display:flex;align-items:center;gap:8px}
.search-trigger{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-size:13.5px;min-width:210px;transition:border-color .15s}
.search-trigger:hover{border-color:var(--accent);color:var(--text)}
.search-trigger svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.search-trigger .st-label{flex:1;text-align:left}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);flex:none;transition:border-color .15s,color .15s}
.icon-btn:hover{border-color:var(--accent);color:var(--text)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="dark"] .i-moon,:root[data-theme="light"] .i-sun{display:none}

/* ---------- layout ---------- */
main{flex:1;width:100%;max-width:var(--maxw);margin:0 auto;padding:0 var(--gut) 80px;outline:none}
.section{margin-top:72px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}
.section-head h2{font:700 clamp(24px,2.6vw,30px)/1.25 var(--serif);margin:0 0 6px}
.section-head p{margin:0;color:var(--muted);max-width:720px}
.link-more{flex:none;display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:14.5px;white-space:nowrap}
.link-more:hover{text-decoration:underline}
.link-more .ic{width:16px;height:16px}
.eyebrow{margin:0;color:var(--accent);font:700 12px/1.4 var(--sans);letter-spacing:.16em}
.lead{color:var(--text-2);font-size:clamp(16px,1.5vw,18px);line-height:1.75;max-width:760px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,2.4vw,28px)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:14.5px;font-weight:600;white-space:nowrap;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn .ic{width:17px;height:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.progress{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;flex:1}
.progress span{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .35s ease}
.input{width:100%;height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{height:auto;padding:12px 13px;line-height:1.6;resize:vertical;font-size:14px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .row{justify-content:center;margin-top:14px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center;padding:clamp(36px,6vw,80px) 0 clamp(30px,4vw,56px)}
.hero h1{font:700 clamp(38px,5.2vw,68px)/1.12 var(--serif);letter-spacing:.01em;margin:16px 0 18px}
.hero .lead{margin:0 0 28px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.hero-actions .btn{height:48px;padding:0 22px;font-size:15.5px;border-radius:12px}
.hero-progress{margin-top:30px;max-width:460px}
.hp-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px}
.hp-top b{color:var(--accent);font-size:16px}
.hero-reel{margin:0}
.reel-frame{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;box-shadow:var(--shadow);border:1px solid var(--line)}
.reel-frame::before,.reel-frame::after{content:"";position:absolute;left:0;right:0;height:7%;background:#000;z-index:1;pointer-events:none}
.reel-frame::before{top:0}.reel-frame::after{bottom:0}
.reel-frame video{width:100%;height:100%;object-fit:cover}
.hero-reel figcaption{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13.5px;color:var(--muted)}
.hero-reel figcaption a{display:inline-flex;align-items:center;gap:3px;color:var(--accent)}
.hero-reel figcaption .ic{width:15px;height:15px}
.band{border:1px solid var(--line);border-radius:var(--r);background:var(--bg-2);padding:0 clamp(18px,2.4vw,30px)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,40px);padding:28px 0}
.step{display:flex;gap:14px;align-items:flex-start}
.step-ic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.step-ic .ic{width:20px;height:20px}
.step b{display:block;font-size:15px;margin-bottom:3px}
.step p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.chapter-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.chapter-card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--shadow)}
.cc-cover{position:relative;aspect-ratio:2.1/1;background:var(--surface-3);overflow:hidden}
.cc-cover img{width:100%;height:100%;object-fit:cover;opacity:.85;transition:transform .5s,opacity .3s}
.chapter-card:hover .cc-cover img{transform:scale(1.04);opacity:1}
.cc-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
.cc-num{position:absolute;left:14px;bottom:8px;z-index:1;color:#fff;font:700 30px/1 var(--serif);letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.cc-body{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.cc-body h3{margin:0;font:700 19px/1.35 var(--serif)}
.cc-body>p{margin:4px 0 10px;color:var(--muted);font-size:13.5px;line-height:1.55}
.cc-lessons{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.cc-lessons li{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--text-2)}
.cc-lessons li.done{background:var(--ok-soft);color:var(--ok)}
.cc-foot{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.chapter-card.complete .progress span{background:var(--ok)}
.cat-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.cat-links a{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;transition:border-color .15s}
.cat-links a:hover{border-color:var(--accent)}
.cat-links small{color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- page head ---------- */
.page-head{padding:clamp(28px,4vw,48px) 0 20px}
.page-head h1{font:700 clamp(30px,3.6vw,44px)/1.2 var(--serif);margin:10px 0 10px}
.page-head .lead{margin:0}

/* ---------- tiles ---------- */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s;min-width:0}
.tile:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--shadow)}
.thumb{position:relative;aspect-ratio:16/9;background:var(--surface-3);overflow:hidden}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb video.preview{opacity:0;transition:opacity .2s}
.thumb video.preview.on{opacity:1}
.thumb.noimg::before{content:"素材暂不可用";position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12px}
.badge{position:absolute;left:8px;top:8px;z-index:2;display:inline-flex;align-items:center;gap:3px;padding:2px 7px 2px 5px;border-radius:6px;font-size:11px;font-weight:600;background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(4px)}
.badge.s{padding-left:7px;color:#e6e0d6}
.badge .ic{width:12px;height:12px;fill:#fff;stroke:none}
.fav-dot{position:absolute;right:8px;top:8px;z-index:2;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);display:none;place-items:center}
.fav-dot.on{display:grid}
.fav-dot .ic{width:14px;height:14px;fill:var(--accent);stroke:var(--accent)}
.tile-body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile-cat{font-size:11.5px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.tile-zh{font-weight:700;font-size:15.5px;line-height:1.4}
.tile-en{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-def{margin-top:6px;color:var(--text-2);font-size:13px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile.small .tile-body{padding:9px 11px 11px}
.tile.small .tile-zh{font-size:14px}
.tile.small .tile-def{font-size:12px;-webkit-line-clamp:2;color:var(--muted)}

/* ---------- learn ---------- */
.learn-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start;padding-top:28px}
.side{position:sticky;top:calc(var(--top) + 20px);max-height:calc(100vh - var(--top) - 40px);overflow:auto;padding-right:4px;scrollbar-width:thin}
.side-title{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:0 0 10px 10px}
.side-list,.side-lessons{list-style:none;margin:0;padding:0}
.side-ch{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:14px;color:var(--text-2);transition:background .15s}
.side-ch:hover{background:var(--surface-2)}
.side-list>li.cur>.side-ch{background:var(--surface-2);color:var(--text);font-weight:700}
.sn{font:700 12px/1 var(--mono);color:var(--faint);width:18px}
.cur .sn{color:var(--accent)}
.st{flex:1;min-width:0}
.sc{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.side-lessons{margin:4px 0 10px 19px;border-left:1px solid var(--line-2);padding-left:8px}
.side-lessons a{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;font-size:13.5px;color:var(--muted);line-height:1.45}
.side-lessons a:hover{color:var(--text)}
.side-lessons a.here{color:var(--text);background:var(--accent-soft)}
.chk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.chk .ic{width:10px;height:10px;stroke-width:3;opacity:0}
.side-lessons a.done .chk{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.side-lessons a.done .chk .ic{opacity:1}
.chapter-chips{display:none}
.chapter-head{padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.chapter-head h1{font:700 clamp(32px,4vw,48px)/1.15 var(--serif);margin:10px 0 8px}
.chapter-head .lead{margin:0;color:var(--text)}
.chapter-desc{color:var(--muted);margin:8px 0 18px;max-width:760px}
.chapter-progress{display:flex;align-items:center;gap:12px;max-width:420px;font-size:13px;color:var(--muted);margin-bottom:18px}
.lesson{padding:36px 0 38px;border-bottom:1px solid var(--line)}
.lesson-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lesson-num{font:700 14px/1 var(--mono);color:var(--accent);padding:6px 8px;border-radius:7px;background:var(--accent-soft)}
.lesson-head h2{flex:1;min-width:0;margin:0;font:700 clamp(22px,2.4vw,28px)/1.3 var(--serif)}
.done-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);font-size:13.5px;font-weight:600;transition:all .15s}
.done-btn .ic{width:15px;height:15px;stroke-width:2.4}
.done-btn:hover{border-color:var(--ok);color:var(--ok)}
.done-btn.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.lesson-text{font-size:17px;line-height:1.85;color:var(--text);max-width:760px;margin:16px 0 18px}
.practice{display:flex;gap:14px;align-items:flex-start;max-width:760px;padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent)}
.practice-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.practice b{font-size:13px;color:var(--accent);letter-spacing:.04em}
.practice p{margin:3px 0 0;font-size:15.5px;line-height:1.75}
.practice .practice-q{color:var(--muted);font-size:13.5px;margin-top:8px}
.samples-head{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;font-size:13px;color:var(--muted)}
.samples-head b{color:var(--text);font-size:14.5px}
.lesson-tiles{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.lesson.is-done .lesson-head h2{color:var(--text-2)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:36px}
.pg{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);transition:border-color .15s}
.pg:hover{border-color:var(--accent)}
.pg small{color:var(--muted);font-size:12.5px}
.pg span{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px}
.pg.next{text-align:right;align-items:flex-end}

/* ---------- library ---------- */
.toolbar{position:sticky;top:var(--top);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:0 calc(var(--gut) * -1) 20px;padding:12px var(--gut) 12px;border-bottom:1px solid var(--line)}
.toolbar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search-box{position:relative;flex:1 1 320px;min-width:0}
.search-box .ic-search{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--muted)}
.search-box .input{padding-left:38px}
.seg-ctl{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}

@keyframes fade{from{opacity:0}}

.m-pos{font:12.5px var(--mono);color:var(--muted);margin-right:4px}

.quiz-top{display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--muted);margin-bottom:16px;max-width:720px}

.quiz-media{border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/9;border:1px solid var(--line)}
.quiz-media video,.quiz-media img{width:100%;height:100%;object-fit:contain}
.quiz-side h2{margin:0 0 14px;font:700 22px/1.35 var(--serif)}
.quiz-opts{display:grid;gap:9px}
.quiz-opt{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);transition:border-color .15s,background .15s}
.quiz-opt:hover:not(:disabled){border-color:var(--accent)}
.quiz-opt span{display:flex;flex-direction:column}
.quiz-opt b{font-size:15.5px}
.quiz-opt small{color:var(--muted);font-size:12.5px}
.quiz-opt:disabled{cursor:default}
.quiz-opt.right{border-color:var(--ok);background:var(--ok-soft)}
.quiz-opt.wrong{border-color:var(--bad);background:var(--bad-soft)}

.quiz-feedback{margin-top:16px;padding:14px 16px;border-radius:12px;border:1px solid var(--line)}
.quiz-feedback.ok b{color:var(--ok)}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}

.board-item{position:relative}
.board-item .tile{height:100%}
.bi-check{position:absolute;left:8px;top:8px;z-index:3;width:28px;height:28px;border-radius:8px;background:rgba(0,0,0,.6);display:grid;place-items:center;cursor:pointer}

.board-item .badge{left:44px}
.board-item>.icon-btn{position:absolute;right:8px;top:8px;z-index:3;width:28px;height:28px;border-radius:8px;background:rgba(0,0,0,.6);border:0;color:#fff}
.board-item>.icon-btn svg{width:15px;height:15px}
.board-item .fav-dot{display:none}
.composer{position:sticky;top:calc(var(--top) + 20px);display:flex;flex-direction:column;gap:14px}
.composer h2{margin:0;font:700 20px/1.3 var(--serif)}
.composer .out{min-height:180px;font-size:13.5px}
.zh-out{font-size:13px;line-height:1.7;margin:0}

/* ---------- footer / toast ---------- */
.site-foot{border-top:1px solid var(--line);background:var(--bg-2)}
.foot-in{max-width:var(--maxw);margin:0 auto;padding:26px var(--gut) 34px;font-size:13px;color:var(--muted)}
.foot-in p{margin:0 0 8px;max-width:900px}
.foot-in a{color:var(--text-2);text-decoration:underline;text-underline-offset:3px}
.foot-keys kbd{margin:0 2px}
.toast{position:fixed;left:50%;bottom:28px;z-index:90;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:10px 16px;border-radius:10px;background:var(--text);color:var(--bg);font-size:14px;font-weight:600;box-shadow:var(--shadow);transition:all .22s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1080px){

  .chapter-chips::-webkit-scrollbar{display:none}

const CAT_COUNT = {};

function searchEntries(q, pool) {
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  const rows = pool || IDX;
  if (toks.length === 0) return rows.map(r => r[0]);
  const out = [];
  rows.forEach(r => {
    const e = FULL && FULL[r[0]];
    const head = [r[1], r[2], r[0].replace(/-/g, ' '), r[7] || ''].join(' ').toLowerCase();
    const body = head + ' ' + [catZh(r[3]), CATS[r[3]] ? CATS[r[3]].en : '',
      e ? [e.d[0], e.d[1], e.pi[0], e.pi[1], e.cp[0], e.cp[1]].join(' ') : ''].join(' ').toLowerCase();
    if (toks.every(t => body.indexOf(t) >= 0)) out.push([toks.every(t => head.indexOf(t) >= 0) ? 0 : 1, r[0]]);
  });
  return out.sort((a, b) => a[0] - b[0]).map(x => x[1]);
}

  Q.round = null;
}

/* ----- board (收藏夹 + 提示词组合) ----- */
function viewBoard() {
  main.appendChild(h('section', { class: 'page-head' },
    h('p', { class: 'eyebrow' }, 'MY BOARD'),
    h('h1', null, '收藏夹'),
    h('p', { class: 'lead' }, '把想用的手法收进来，勾选后自动拼成一条提示词。适合给 AI 视频 / 图像工具写镜头语言。')));
  if (S.fav.length === 0) {
    main.appendChild(h('div', { class: 'empty card' },
      h('p', null, '还没有收藏。打开任意手法详情，点「收藏」（或按 F）即可加入。'),
      h('div', { class: 'row' }, h('a', { class: 'btn primary', href: '#/library' }, '去手法图鉴'), h('a', { class: 'btn', href: '#/learn/0' }, '从课程开始'))));
    return;
  }
  const need = S.fav.filter(s => entryOf(s) == null);
  if (need.length) {
    const hold = h('p', { class: 'muted' }, '正在载入收藏的词条…');
    main.appendChild(hold);
    loadFull().then(() => { if (curPath === '/board') { main.textContent = ''; viewBoard(); } },
      () => { hold.textContent = '词条数据载入失败，请刷新重试。'; });
    return;
  }
  const picked = s => S.pick[s] !== false;
  let src = store.get('board-src', 'hp');
  const pairOf = e => (src === 'hp' ? (e.hp || e.cp) : e[src]);
  const subj = h('input', { class: 'input', type: 'text', value: S.subject, placeholder: '例如 a woman in a red raincoat', 'aria-label': '主体', autocomplete: 'off' });
  const out = h('textarea', { class: 'input out', rows: '7', 'aria-label': '组合后的提示词', spellcheck: 'false' });
  const zhOut = h('p', { class: 'muted zh-out' });
  const srcSeg = h('div', { class: 'seg-ctl', role: 'group', 'aria-label': '取哪种提示词' },
    [['hp', '简洁写法'], ['cp', '片例原句'], ['pi', '通用模板（长）']].map(([k, t]) => h('button', { type: 'button', 'data-k': k, class: src === k ? 'on' : '' }, t)));
  function compose() {
    const chosen = S.fav.filter(picked).map(entryOf).filter(Boolean);
    out.value = chosen.map(e => fillSubject(pairOf(e)[0]).trim()).join('\n\n');
    zhOut.textContent = chosen.length ? '中文参考：' + chosen.map(e => fillSubject(pairOf(e)[1] || '')).join(' / ') : '勾选左侧的手法来组合。';
  }
  srcSeg.addEventListener('click', ev => { const b = ev.target.closest('button'); if (b == null) return; src = b.dataset.k; store.set('board-src', src); srcSeg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); compose(); });
  subj.addEventListener('input', () => { S.subject = subj.value; store.set('subject', S.subject); compose(); });

  const list = h('div', { class: 'board-list' });
  S.fav.forEach(s => {
    const cb = h('input', { type: 'checkbox', 'aria-label': '加入组合：' + IDXMAP[s][2] });
    cb.checked = picked(s);
    cb.addEventListener('change', () => { S.pick[s] = cb.checked; store.set('pick', S.pick); compose(); });
    const rm = h('button', { type: 'button', class: 'icon-btn', 'aria-label': '移出收藏', title: '移出收藏', onclick: () => { toggleFav(s); main.textContent = ''; viewBoard(); } }, icon('close'));
    list.appendChild(h('div', { class: 'board-item' }, h('label', { class: 'bi-check' }, cb), tile(s, { list: S.fav.slice(), cat: true }), rm));
  });
  main.appendChild(h('div', { class: 'board' },
    list,
    h('aside', { class: 'composer card' },
      h('h2', null, '组合提示词'),
      h('label', { class: 'field' }, h('span', null, '主体（替换 [Subject]）'), subj),
      h('div', { class: 'field' }, h('span', null, '每条取'), srcSeg, h('small', { class: 'muted' }, '简洁写法 = 原站正文里的通用提示词行（没有则用片例原句），最适合拼接。')),
      out,
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn primary', onclick: () => copyText(out.value, '组合提示词') }, icon('copy'), '复制组合'),
        h('button', { type: 'button', class: 'btn', onclick: () => {
          const md = S.fav.map(s => { const e = entryOf(s); return '- ' + e.z + '（' + e.t + '）' + e.u; }).join('\n');
          copyText(md, '收藏清单');
        } }, '复制清单')),
      zhOut)));
  compose();
}

/* ---------- palette search ---------- */
const pal = $('#palette'), palQ = $('#palette-q'), palList = $('#palette-list');
let palItems = [], palSel = 0;
function openPalette(prefill) {
  if (modal.hidden === false) closeEntry();
  pal.hidden = false;
  document.documentElement.classList.add('locked');
  palQ.value = prefill || '';
  renderPalette();
  palQ.focus();
  loadFull().then(() => { if (pal.hidden === false && palQ.value.trim()) renderPalette(); }, () => {});
}
function closePalette() {
  pal.hidden = true;
  if (modal.hidden) document.documentElement.classList.remove('locked');
}
function renderPalette() {
  const q = palQ.value.trim();
  const ql = q.toLowerCase();
  palItems = [];
  if (q === '') {
    const nx = nextLesson();
    if (nx) palItems.push({ kind: '继续', t: CH[nx[0]].lessons[nx[1]].t, sub: '第 ' + (nx[0] + 1) + ' 章 · ' + CH[nx[0]].n, go: () => go('/learn/' + nx[0] + '/' + nx[1]) });
    CH.forEach((c, ci) => palItems.push({ kind: '章节', t: pad(ci + 1) + ' ' + c.n, sub: c.sub, go: () => go('/learn/' + ci) }));
  } else {
    CH.forEach((c, ci) => c.lessons.forEach((l, li) => {
      if ([c.n, l.t, l.x, l.p].join(' ').toLowerCase().indexOf(ql) >= 0)
        palItems.push({ kind: '课程', t: l.t, sub: '第 ' + (ci + 1) + ' 章 · ' + c.n, go: () => go('/learn/' + ci + '/' + li) });
    }));
    const hits = searchEntries(q);
    hits.slice(0, 40).forEach(s => {
      const r = IDXMAP[s];
      palItems.push({ kind: catZh(r[3]), t: r[2], en: r[1], thumb: r[5], go: () => openEntry(s, hits.slice(0, 40)) });
    });
  }
  palSel = 0;
  palList.textContent = '';
  if (palItems.length === 0) palList.appendChild(h('p', { class: 'pal-empty' }, '没有结果。试试英文名，或更短的关键词。'));
  palItems.forEach((it, i) => {
    const row = h('div', { class: 'pal-item', role: 'option', id: 'pal-' + i, 'aria-selected': i === 0 ? 'true' : 'false',
      onclick: () => pick(i), onmousemove: () => select(i) },
      it.thumb ? h('span', { class: 'pal-thumb' }, thumbImg(it.thumb, '')) : h('span', { class: 'pal-thumb ph' }, icon('book')),
      h('span', { class: 'pal-main' }, h('b', null, it.t), it.en ? h('small', { lang: 'en' }, it.en) : it.sub ? h('small', null, it.sub) : null),
      h('span', { class: 'pal-kind' }, it.kind));
    palList.appendChild(row);
  });
  if (FULL == null && q) palList.appendChild(h('p', { class: 'pal-empty' }, '全文索引载入中，稍后会包含提示词里的匹配…'));
}
function select(i) {
  if (palItems.length === 0) return;
  palSel = (i + palItems.length) % palItems.length;
  palList.querySelectorAll('.pal-item').forEach((n, k) => n.setAttribute('aria-selected', k === palSel ? 'true' : 'false'));
  const n = $('#pal-' + palSel);
  if (n) n.scrollIntoView({ block: 'nearest' });
}
function pick(i) { const it = palItems[i]; if (it == null) return; closePalette(); it.go(); }
let palT = 0;
palQ.addEventListener('input', () => { clearTimeout(palT); palT = setTimeout(renderPalette, 70); });
palQ.addEventListener('keydown', ev => {
  if (ev.key === 'ArrowDown') { ev.preventDefault(); select(palSel + 1); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); select(palSel - 1); }
  else if (ev.key === 'Enter') { ev.preventDefault(); pick(palSel); }
});
pal.addEventListener('click', ev => { if (ev.target.hasAttribute('data-close')) closePalette(); });
$('#open-palette').addEventListener('click', () => openPalette());

/* ---------- global keys ---------- */
const typing = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    if (pal.hidden === false) { closePalette(); return; }
    if (modal.hidden === false) { closeEntry(); return; }
  }
  if ((ev.key === 'k' || ev.key === 'K') && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); if (pal.hidden) openPalette(); else closePalette(); return; }
  if (typing(ev.target) || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (pal.hidden === false) return;
  if (ev.key === '/') { ev.preventDefault(); openPalette(); return; }
  if (modal.hidden === false && modalSlug) {
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
      const list = modalList && modalList.indexOf(modalSlug) >= 0 ? modalList : null;
      if (list) { ev.preventDefault(); const p = list.indexOf(modalSlug); openEntry(list[(p + (ev.key === 'ArrowLeft' ? -1 : 1) + list.length) % list.length], list); }
    } else if (ev.key === 'f' || ev.key === 'F') { toggleFav(modalSlug); }
    return;
  }
  if (curPath === '/quiz' && Q.round && /^[1-4]$/.test(ev.key)) {
    const b = main.querySelectorAll('.quiz-opt')[+ev.key - 1];
    if (b && b.disabled === false) b.click();
  }
});

/* ---------- theme ---------- */
$('#theme-toggle').addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.dataset.theme === 'light' ? 'dark' : 'light';
  root.dataset.theme = next;
  try { localStorage.setItem('ct-theme', next); } catch (e) { /* ignore */ }
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.content = next === 'light' ? '#f6f3ee' : '#0d0e11';
});

// 顶栏滚动后加分隔线
const topbar = document.querySelector('.topbar');
window.addEventListener('scroll', () => topbar.classList.toggle('scrolled', window.scrollY > 8), { passive: true });

syncFavUI();
window.addEventListener('hashchange', route);
route();
})();
</script>
